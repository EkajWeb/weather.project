<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EkajCast — Weather by Ekaj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="weather-clear is-day">

  <div class="weather-fx" id="weather-fx" aria-hidden="true"></div>
  <div class="lightning-flash" id="lightning-flash" aria-hidden="true"></div>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="logo-mark">⛅</span>
        <h1>EkajCast</h1>
      </div>

      <form class="search-form" id="search-form">
        <input type="text" id="city-input" placeholder="Search city, e.g. Tokyo" aria-label="Search city" autocomplete="off" />
        <button type="submit" class="icon-btn" aria-label="Search">🔍</button>
      </form>

      <button class="locate-btn" id="locate-btn">📍 Use My Location</button>
    </header>

    <main>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Fetching weather…</p>
      </div>

      <div class="error-state" id="error-state">
        <p id="error-message">City not found. Try another search.</p>
      </div>

      <section class="weather-card glass" id="weather-card">
        <div class="card-top">
          <div class="location">
            <h2 id="city-name">—</h2>
            <p id="date-time">—</p>
          </div>
          <img id="weather-icon" src="" alt="" class="weather-icon" />
        </div>

        <div class="card-main">
          <p class="temp"><span id="temperature">--</span>°</p>
          <p class="description" id="description">—</p>
          <p class="feels-like" id="feels-like">Feels like --°</p>
        </div>
      </section>

      <section class="details-grid" id="details-grid">
        <div class="detail-item glass">
          <span class="detail-label">Humidity</span>
          <span class="detail-value" id="humidity-value">--%</span>
        </div>
        <div class="detail-item glass">
          <span class="detail-label">Wind</span>
          <span class="detail-value" id="wind-value">-- km/h</span>
        </div>
        <div class="detail-item glass">
          <span class="detail-label">Pressure</span>
          <span class="detail-value" id="pressure-value">-- hPa</span>
        </div>
        <div class="detail-item glass">
          <span class="detail-label">Visibility</span>
          <span class="detail-value" id="visibility-value">-- km</span>
        </div>
      </section>

      <section class="sun-times glass" id="sun-times">
        <div class="sun-item">
          <span class="detail-label">Sunrise</span>
          <span class="detail-value" id="sunrise-value">--:--</span>
        </div>
        <div class="sun-divider" aria-hidden="true"></div>
        <div class="sun-item">
          <span class="detail-label">Sunset</span>
          <span class="detail-value" id="sunset-value">--:--</span>
        </div>
      </section>

      <section class="forecast glass" id="forecast">
        <h3>5-Day Forecast</h3>
        <div class="forecast-list" id="forecast-list"></div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
